name: CI/CD - Employee Task Manager

# runs on every push to main, and also lets me trigger it manually
# from the Actions tab when I just want to re-deploy without a new commit
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Build application
        run: mvn -B clean package -DskipTests

      # keep the jar around so the next job doesn't need to rebuild it
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/employee-task-manager.jar

 docker-build-push:
      needs: build-and-test
      runs-on: ubuntu-latest
      if: false   # skipped: requires a live Azure Container Registry, not set up yet
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/employee-task-manager:${{ github.sha }} .

      - name: Tag as latest
        run: docker tag ${{ secrets.ACR_LOGIN_SERVER }}/employee-task-manager:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/employee-task-manager:latest

      - name: Push image to ACR
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/employee-task-manager:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/employee-task-manager:latest

  deploy-to-aks:
    needs: docker-build-push
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Apply k8s manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      # swaps in the image we just pushed instead of relying on
      # whatever :latest happens to resolve to
      - name: Update deployment image
        run: kubectl set image deployment/employee-api employee-api=${{ secrets.ACR_LOGIN_SERVER }}/employee-task-manager:${{ github.sha }}

      - name: Wait for rollout
        run: kubectl rollout status deployment/employee-api --timeout=120s
