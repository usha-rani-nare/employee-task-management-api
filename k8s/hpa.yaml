# Autoscaling based on CPU. Kept simple on purpose - this is what
# "kubectl scale deployment employee-api --replicas=3" evolves into
# once you want it to happen automatically instead of by hand.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: employee-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: employee-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
