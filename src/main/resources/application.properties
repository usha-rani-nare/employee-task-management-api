spring.application.name=employee-task-manager

# DB config comes from env vars so the same jar works locally, in Docker,
# and in Kubernetes without touching this file. Defaults below are for
# running it on a laptop with a local MySQL instance.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taskmanager}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${SERVER_PORT:8080}

# Actuator endpoints - this is what Azure Monitor / any scraper hits.
# health shows DB connectivity too (down if MySQL is unreachable),
# which is exactly what you want for the "check application logs ->
# DB connection failure" incident scenario in the README.
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

logging.level.root=INFO
logging.level.com.usharani.taskmanager=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
